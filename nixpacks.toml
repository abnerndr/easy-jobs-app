# Dokploy → Application → Build Type: Nixpacks
# Port: 3000
# Docs: https://nixpacks.com/docs/configuration/file
# Dokploy: https://docs.dokploy.com/docs/core/applications/build-type

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
# Prisma está em devDependencies — precisa no build (generate) e no start (migrate).
NPM_CONFIG_PRODUCTION = "false"
YARN_PRODUCTION = "false"
PORT = "3000"
RESUME_STORAGE_DIR = "/app/data/resumes"

[phases.setup]
# Ubuntu 24.04 (Noble): pacotes t64. Lista alinhada ao Playwright Chromium.
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "libasound2t64",
  "libatk-bridge2.0-0t64",
  "libatk1.0-0t64",
  "libatspi2.0-0t64",
  "libcups2t64",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libgtk-3-0t64",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "xdg-utils",
]

[phases.install]
cmds = ["yarn install --frozen-lockfile"]

[phases.build]
cmds = [
  # prisma.config.ts exige DATABASE_URL; generate não conecta no banco.
  # Se o Dokploy já injetar DATABASE_URL no build, ela é reutilizada.
  "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-postgresql://build:build@127.0.0.1:5432/build?schema=public}\"; yarn prisma generate'",
  "yarn build",
  "npx playwright install chromium",
]

[start]
cmd = "mkdir -p \"$RESUME_STORAGE_DIR\" && yarn prisma:migrate && yarn start"
