# Dokploy → Build Type: Nixpacks (com noVNC) ou Dockerfile
# Port pública: 3000 (gateway → Next :3001 + noVNC :6080)
# Docs: https://nixpacks.com/docs/configuration/file

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
# Prisma está em devDependencies — precisa no build (generate) e no start (migrate).
NPM_CONFIG_PRODUCTION = "false"
YARN_PRODUCTION = "false"
PORT = "3000"
APP_PORT = "3001"
GATEWAY_PORT = "3000"
NOVNC_PORT = "6080"
VNC_PORT = "5900"
RESUME_STORAGE_DIR = "/app/data/resumes"
PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"
DISPLAY = ":99"
PLAYWRIGHT_HEADED = "true"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "0"
REMOTE_LOGIN_MODE = "novnc"

[phases.setup]
# Nixpacks com NODE 22 defaultia para 22.11; Prisma 7 exige ^22.12.
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"
# NÃO incluir o pacote nix "yarn": ele puxa Node 20 e quebra engines (^22.12).
nixPkgs = ["nodejs_22"]
# Ubuntu 24.04: libs Chromium + Xvfb + noVNC
aptPkgs = [
  "ca-certificates",
  "curl",
  "fonts-liberation",
  "libasound2t64",
  "libatk-bridge2.0-0t64",
  "libatk1.0-0t64",
  "libatspi2.0-0t64",
  "libcups2t64",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libgtk-3-0t64",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "xdg-utils",
  "xvfb",
  "x11vnc",
  "novnc",
  "websockify",
  "procps",
]

[phases.install]
cmds = [
  "node -v",
  "corepack enable",
  "corepack prepare yarn@1.22.22 --activate",
  "yarn -v",
  "yarn install --frozen-lockfile",
]

[phases.build]
cmds = [
  "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-postgresql://build:build@127.0.0.1:5432/build?schema=public}\"; yarn prisma generate'",
  "yarn build",
  "chmod +x scripts/install-playwright.sh scripts/nixpacks-start.sh scripts/gateway.mjs && PLAYWRIGHT_SKIP_DEPS=1 ./scripts/install-playwright.sh",
]

[start]
cmd = "bash scripts/nixpacks-start.sh"
