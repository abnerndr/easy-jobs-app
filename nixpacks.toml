# Dokploy → Application → Build Type: Nixpacks
# Port: 3000
# Docs: https://nixpacks.com/docs/configuration/file

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
# Prisma está em devDependencies — precisa no build (generate) e no start (migrate).
NPM_CONFIG_PRODUCTION = "false"
YARN_PRODUCTION = "false"
PORT = "3000"
RESUME_STORAGE_DIR = "/app/data/resumes"
PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"
DISPLAY = ":99"
PLAYWRIGHT_HEADED = "true"
# Evita redownload no start; install só no build.
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "0"

[phases.setup]
# Nixpacks com NODE 22 defaultia para 22.11; Prisma 7 exige ^22.12.
# Pin do nixpkgs com Node 22.13.1:
# https://github.com/NixOS/nixpkgs/commit/51ad838b03a05b1de6f9f2a0fffecee64a9788ee
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"
# NÃO incluir o pacote nix "yarn": ele puxa Node 20 e quebra engines (^22.12).
# Yarn vem via Corepack do Node 22 (ver phases.install).
nixPkgs = ["nodejs_22"]
# Ubuntu 24.04 (Noble): pacotes t64 + Xvfb para Chromium headed.
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "libasound2t64",
  "libatk-bridge2.0-0t64",
  "libatk1.0-0t64",
  "libatspi2.0-0t64",
  "libcups2t64",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libgtk-3-0t64",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "xdg-utils",
  "xvfb",
]

[phases.install]
cmds = [
  "node -v",
  "corepack enable",
  "corepack prepare yarn@1.22.22 --activate",
  "yarn -v",
  "yarn install --frozen-lockfile",
]

[phases.build]
cmds = [
  # prisma.config.ts exige DATABASE_URL; generate não conecta no banco.
  "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-postgresql://build:build@127.0.0.1:5432/build?schema=public}\"; yarn prisma generate'",
  "yarn build",
  # Instala Chromium só se ainda não existir (scripts/install-playwright.sh).
  "chmod +x scripts/install-playwright.sh && PLAYWRIGHT_SKIP_DEPS=1 ./scripts/install-playwright.sh",
]

[start]
cmd = "mkdir -p \"$RESUME_STORAGE_DIR\" /app/data/sessions && (test -f /tmp/.X99-lock || Xvfb :99 -screen 0 1280x900x24 -ac >/tmp/xvfb.log 2>&1 &) && yarn prisma:migrate && yarn start"
